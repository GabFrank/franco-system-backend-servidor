# ============================================================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ============================================================================
# Este archivo contiene la configuración compartida para el ambiente de desarrollo
# Las propiedades personalizables por desarrollador están en application-user-dev.properties
# 
# NOTA: application-user-dev.properties se carga mediante UserDevPropertiesConfig.java
# que usa @PropertySource con @Order para garantizar que sobrescribe las propiedades anteriores
# ============================================================================

# ----------------------------------------------------------------------------
# DataSource Configuration
# ----------------------------------------------------------------------------
# NOTA: Estas propiedades pueden ser sobrescritas por application-user-dev.properties
# Valores por defecto (pueden variar por desarrollador)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5551/bodega_fact_test_2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:franco}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:franco}

# ----------------------------------------------------------------------------
# Server Configuration
# ----------------------------------------------------------------------------
# NOTA: Estas propiedades pueden ser sobrescritas por application-user-dev.properties
server.port=${SERVER_PORT:8081}
#server.address=localhost

# ----------------------------------------------------------------------------
# SIFEN - Configuración de Facturación Electrónica
# ----------------------------------------------------------------------------
# Esto puede ser:
# DEV (apunta al ambiente de desarrollo/test de SIFEN)
# PROD (apunta al ambiente de producción de SIFEN)
sifen.enabled=true
sifen.ambiente=PROD

# NO modificar a menos que uno sepa bien lo que está haciendo
# sifen.url_base=

# Si se va a usar el certificado cliente.
# Este valor en el 99.99% de las veces va a ser true
# a menos que uno sepa bien lo que está haciendo
sifen.certificado.usar=true
# Por ahora, el único valor aceptado es PFX
sifen.certificado.tipo=PFX

# NOTA: Estas propiedades DEBEN ser configuradas en application-user-dev.properties
# ya que varían por desarrollador (rutas y contraseñas específicas)
# Se dejan sin definir aquí para que application-user-dev.properties las sobrescriba
# Si no están en application-user-dev.properties, se usará el valor de application.properties
#sifen.certificado.archivo=/path/to/certificado.pfx
#sifen.certificado.contrasena=password

## Nota técnica 13 (23/04/2023)
## Para habilitar los campos nuevos de esta nota técnica, cambiar a true
sifen.habilitar-nota-tecnica-13=true

## CSC
sifen.csc=D37561586c1CAd69A2e7747E73f9F03B
sifen.csc-id=0001
tipoContribuyenteEmisor=2

# ----------------------------------------------------------------------------
# Flyway Configuration for dev environment
# ----------------------------------------------------------------------------
# Disable validation to allow missing migrations that will be added later from other branches
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-missing-migrations=true
