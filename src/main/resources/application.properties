# ----------------------------------------------------------------------------
# SIFEN - Configuración de Facturación Electrónica
# ----------------------------------------------------------------------------
# NOTA: En profile "dev", estas propiedades pueden ser sobrescritas por 
# application-dev.properties y application-user-dev.properties
sifen.enabled=false
sifen.ambiente=PROD
sifen.certificado.usar=true
sifen.certificado.tipo=PFX
# Valor por defecto (se sobrescribe en dev con application-user-dev.properties)
sifen.certificado.archivo=${SIFEN_CERT_PATH:/home/franco/Documents/franco-sa.pfx}
sifen.certificado.contrasena=${SIFEN_CERT_PASSWORD:fasa1701}
sifen.csc=${SIFEN_CSC:D37561586c1CAd69A2e7747E73f9F03B}
sifen.cscId=${SIFEN_CSC_ID:0001}
sifen.habilitarNotaTecnica13=true
# Consulta automatica de los lotes de notas de credito y de remision que envia el central
# (SifenSchedulerService.consultarLotesDeNotas). Apagada por defecto: se prende por instancia con
# SIFEN_NOTAS_CONSULTA_ENABLED=true en el .env (hoy solo bodega). No corre si
# sifen.scheduler.enabled=true, porque ahi el scheduler general ya consulta todos los lotes.
sifen.notas.consulta.enabled=${SIFEN_NOTAS_CONSULTA_ENABLED:false}
sifen.notas.consulta.fixed-delay=${SIFEN_NOTAS_CONSULTA_FIXED_DELAY:120000}

app.notifications.dispatch-interval=1000
app.notifications.batch-size=100
app.notifications.max-attempts=5

# ----------------------------------------------------------------------------
# Notification Cleanup Configuration
# ----------------------------------------------------------------------------
notificacion.cleanup.enabled=true
# Vaciado total del modulo de notificaciones: cada corrida borra todo, no una
# ventana de retencion. Corre cada 7 dias y ademas al arrancar el servidor.
notificacion.cleanup.interval=604800000
notificacion.cleanup.on-startup=true

# ----------------------------------------------------------------------------
# Replication: sync publications with replication_table (scheduler)
# ----------------------------------------------------------------------------
# Si true: al arrancar (tras initial-delay) y cada fixed-delay ms se añaden
# a las publicaciones existentes las tablas que estén en replication_table y falten.
# Solo tiene efecto en el servidor central.
replication.sync.enabled=true
replication.sync.initial-delay=120000
replication.sync.fixed-delay=3600000
# Refresco periódico de suscripciones (red de seguridad si una filial estuvo caída durante el sync)
replication.refresh.enabled=true
replication.refresh.initial-delay=300000
replication.refresh.fixed-delay=7200000

# ----------------------------------------------------------------------------
# Actuator - Health checks and monitoring
# ----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

app.version=@project.version@
spring.application.name=frc-central-server

# ----------------------------------------------------------------------------
# Cotizaciones de mercado (scraping nortecambios.com.py)
# ----------------------------------------------------------------------------
# Integracion best-effort: si nortecambios no responde el sistema sigue operando con la
# ultima cotizacion conocida. Interruptor de corte operativo sin deploy: poner
# cotizacion.mercado.enabled=false en el application.properties externo y reiniciar.
cotizacion.mercado.enabled=true
cotizacion.mercado.fixed-delay=600000
cotizacion.mercado.initial-delay=60000
# Presupuesto total del scrape (DNS + handshake + GET + POST). Los timeouts de
# HttpsURLConnection no cubren la resolucion DNS, por eso hace falta un tope duro.
cotizacion.mercado.timeout-ms=20000

# ----------------------------------------------------------------------------
# Envio del KuDE de la factura electronica al correo del cliente
# ----------------------------------------------------------------------------
# Apagado por defecto. Al prenderlo se envian las facturas electronicas APROBADAS por SIFEN
# de las ultimas `ventana-horas` cuyo cliente tiene un correo guardado; sin correo no se envia.
# Cada factura se envia una sola vez (financiero.factura_legal_correo).
factura.correo.enabled=${FACTURA_CORREO_ENABLED:false}
factura.correo.fixed-delay=60000
factura.correo.initial-delay=90000
factura.correo.ventana-horas=48
# Un envio fallido se reintenta a los 10, 20, 30... minutos, hasta `max-intentos`.
factura.correo.max-intentos=6
factura.correo.reintento-minutos=10
# Tope de correos por vuelta.
factura.correo.lote=20
# Direccion que figura como remitente; vacio = spring.mail.username.
factura.correo.remitente=${FACTURA_CORREO_REMITENTE:}

# Cuenta que envia. Usuario y contrasena van SOLO en el .env de la instancia
# (/opt/frc-backend-central/<instancia>/.env): cada instancia es de una empresa distinta y la
# contrasena no se commitea. Sin MAIL_USERNAME el envio responde "no esta configurado".
# Con Gmail, MAIL_PASSWORD es una contrasena de aplicacion, no la de la cuenta.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# El health del actuator no depende del servidor de correo: si cae, el central sigue sano.
management.health.mail.enabled=false
