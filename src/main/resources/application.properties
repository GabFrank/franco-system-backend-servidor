# ----------------------------------------------------------------------------
# DataSource Configuration
# ----------------------------------------------------------------------------
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://localhost:5551/bodega
#spring.datasource.url=jdbc:postgresql://localhost:5552/central
spring.datasource.username=franco
spring.datasource.password=franco
spring.datasource.hikari.connection-timeout=60000
gps.server.port=5521
# ----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------------------------------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.default_batch_fetch_size=10
# Zona horaria del negocio (JVM default, Jackson, Hibernate). Cambiar aquí o en el perfil activo.
app.timezone=America/Asuncion
spring.jackson.time-zone=${app.timezone}
spring.jpa.properties.hibernate.jdbc.time_zone=${app.timezone}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# ----------------------------------------------------------------------------
# Hibernate Search (Lucene embebido - productos)
# ----------------------------------------------------------------------------
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.root=./data/lucene/productos
spring.jpa.properties.hibernate.search.backend.analysis.configurer=com.franco.dev.config.search.ProductoAnalysisConfigurer
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
# Indexación automática + sincronización explícita al guardar/eliminar productos y códigos
spring.jpa.properties.hibernate.search.indexing.automatic.enabled=true
app.search.producto.enabled=true
# Reindex automático solo si falta algún índice al arrancar (primera vez o deploy nuevo)
app.search.producto.auto-reindex-if-empty=true

# ----------------------------------------------------------------------------
# Flyway Database Migration
# ----------------------------------------------------------------------------
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.ignore-missing-migrations=true
spring.flyway.out-of-order=true

# ----------------------------------------------------------------------------
